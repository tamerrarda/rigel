[workspace]
resolver = "2"
members = ["contracts/rigel-vault", "contracts/price-adapter"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tamerarda/rigel"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
