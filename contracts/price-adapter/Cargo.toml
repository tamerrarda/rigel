[package]
name = "price-adapter"
description = "Trusted stand-in for Pyth on NEAR testnet: same get_price_unsafe interface, fed by one reporter."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
